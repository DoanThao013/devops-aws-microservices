name: Microservices CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'lab02/cau3-microservices-jenkins-k8s/**'
      - '.github/workflows/lab02_cau3_cicd.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  WORK_DIR: lab02/cau3-microservices-jenkins-k8s
  IMAGE_A:  ${{ secrets.DOCKERHUB_USERNAME }}/service-a
  IMAGE_B:  ${{ secrets.DOCKERHUB_USERNAME }}/service-b
  K8S_NS:   nt548-gr03

jobs:
  # STAGE 1 — Checkout Code
  stage-1-checkout:
    name: "Stage 1 — Checkout Code"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Print Repo Structure
        run: |
          echo "=== Repo structure ==="
          find ${{ env.WORK_DIR }} -type f | sort
          echo "✅ Checkout done — commit: ${{ github.sha }}"

  # STAGE 2 — Build Docker Images
  stage-2-build:
    name: "Stage 2 — Build Docker Images"
    runs-on: ubuntu-latest
    needs: stage-1-checkout

    outputs:
      image_tag: ${{ steps.tag.outputs.value }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Image Tag
        id: tag
        run: |
          TAG=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "value=${TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${TAG}"

      - name: Build Service A
        run: |
          docker build \
            -t ${{ env.IMAGE_A }}:${{ steps.tag.outputs.value }} \
            -t ${{ env.IMAGE_A }}:latest \
            ${{ env.WORK_DIR }}/service-a/
          echo "✅ Service A built"

      - name: Build Service B
        run: |
          docker build \
            -t ${{ env.IMAGE_B }}:${{ steps.tag.outputs.value }} \
            -t ${{ env.IMAGE_B }}:latest \
            ${{ env.WORK_DIR }}/service-b/
          echo "✅ Service B built"

  # STAGE 3
  stage-3-unit-test:
    name: "Stage 3 — Unit Test [TODO: Tien]"
    runs-on: ubuntu-latest
    needs: stage-2-build
    outputs:
      image_tag: ${{ needs.stage-2-build.outputs.image_tag }}  # ← truyền tiếp
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Unit Test Placeholder
        run: |
          echo "⏳ Placeholder — Tien will implement"
          echo "  service-a: Jest (npm test)"
          echo "  service-b: pytest test_app.py"

  # STAGE 4
  stage-4-sonarqube:
    name: "Stage 4 — SonarQube Analysis [TODO: Tien]"
    runs-on: ubuntu-latest
    needs: stage-3-unit-test
    outputs:
      image_tag: ${{ needs.stage-3-unit-test.outputs.image_tag }}  # ← truyền tiếp
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: SonarQube Analysis Placeholder
        run: |
          echo "⏳ Placeholder — Tien will implement"
          echo "  Config: sonar/sonar-project.properties"
          echo "  Requires: SONAR_TOKEN secret"

  # STAGE 5
  stage-5-push:
    name: "Stage 5 — Push Images to DockerHub"
    runs-on: ubuntu-latest
    needs: stage-4-sonarqube
    outputs:
      image_tag: ${{ needs.stage-4-sonarqube.outputs.image_tag }}  # ← truyền tiếp
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Rebuild Service A
        run: |
          docker build \
            -t ${{ env.IMAGE_A }}:${{ needs.stage-4-sonarqube.outputs.image_tag }} \
            -t ${{ env.IMAGE_A }}:latest \
            ${{ env.WORK_DIR }}/service-a/
      - name: Rebuild Service B
        run: |
          docker build \
            -t ${{ env.IMAGE_B }}:${{ needs.stage-4-sonarqube.outputs.image_tag }} \
            -t ${{ env.IMAGE_B }}:latest \
            ${{ env.WORK_DIR }}/service-b/
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push Service A
        run: |
          docker push ${{ env.IMAGE_A }}:${{ needs.stage-4-sonarqube.outputs.image_tag }}
          docker push ${{ env.IMAGE_A }}:latest
          echo "✅ Service A pushed → DockerHub"
      - name: Push Service B
        run: |
          docker push ${{ env.IMAGE_B }}:${{ needs.stage-4-sonarqube.outputs.image_tag }}
          docker push ${{ env.IMAGE_B }}:latest
          echo "✅ Service B pushed → DockerHub"

  # STAGE 6
  stage-6-quality-gate:
    name: "Stage 6 — Quality Gate [TODO: Tien]"
    runs-on: ubuntu-latest
    needs: stage-5-push
    outputs:
      image_tag: ${{ needs.stage-5-push.outputs.image_tag }}  # ← truyền tiếp
    steps:
      - name: Quality Gate Placeholder
        run: |
          echo "⏳ Placeholder — Tien will implement"
          echo "  Poll SonarCloud API for pass/fail result"

  # STAGE 7
  stage-7-trivy:
    name: "Stage 7 — Trivy Security Scan [TODO: Tien]"
    runs-on: ubuntu-latest
    needs: stage-6-quality-gate
    outputs:
      image_tag: ${{ needs.stage-6-quality-gate.outputs.image_tag }}  # ← truyền tiếp
    steps:
      - name: Trivy Placeholder
        run: |
          echo "⏳ Placeholder — Tien will implement"
          echo "  Scan: ${{ env.IMAGE_A }}:${{ needs.stage-6-quality-gate.outputs.image_tag }}"
          echo "  Scan: ${{ env.IMAGE_B }}:${{ needs.stage-6-quality-gate.outputs.image_tag }}"

  # STAGE 8
  stage-8-deploy:
    name: "Stage 8 — Deploy to Kubernetes"
    runs-on: [self-hosted, windows, minikube]
    needs: stage-7-trivy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Verify Cluster
        shell: powershell
        run: |
          minikube status
          kubectl get nodes
      - name: Apply Namespace
        shell: powershell
        run: |
          kubectl apply -f ${{ env.WORK_DIR }}/k8s/00-namespace.yaml
      - name: Patch Image Tags & Apply Deployments
        shell: powershell
        run: |
          $TAG  = "${{ needs.stage-7-trivy.outputs.image_tag }}"
          $USER = "${{ secrets.DOCKERHUB_USERNAME }}"
          $DIR  = "${{ env.WORK_DIR }}/k8s"

          (Get-Content "$DIR/10-service-a.yaml") `
            -replace 'REGISTRY/nt548/service-a:TAG', "$USER/service-a:$TAG" |
            kubectl apply -n ${{ env.K8S_NS }} -f -

          (Get-Content "$DIR/20-service-b.yaml") `
            -replace 'REGISTRY/nt548/service-b:TAG', "$USER/service-b:$TAG" |
            kubectl apply -n ${{ env.K8S_NS }} -f -

          Write-Host "✅ Deployments applied — tag: $TAG"
      - name: Apply Ingress
        shell: powershell
        run: |
          kubectl apply -f ${{ env.WORK_DIR }}/k8s/30-ingress.yaml `
            -n ${{ env.K8S_NS }}
      - name: Wait for Rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/service-a `
            -n ${{ env.K8S_NS }} --timeout=120s
          kubectl rollout status deployment/service-b `
            -n ${{ env.K8S_NS }} --timeout=120s
      - name: Verify Deployment
        shell: powershell
        run: |
          Write-Host "=== Pods ==="
          kubectl get pods -n ${{ env.K8S_NS }}
          Write-Host "=== Services ==="
          kubectl get svc  -n ${{ env.K8S_NS }}