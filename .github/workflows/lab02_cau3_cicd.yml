name: Microservices CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'lab02/cau3-microservices-jenkins-k8s/**'
      - '.github/workflows/lab02_cau3_cicd.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  WORK_DIR: lab02/cau3-microservices-jenkins-k8s
  IMAGE_A:  ${{ secrets.DOCKERHUB_USERNAME }}/service-a
  IMAGE_B:  ${{ secrets.DOCKERHUB_USERNAME }}/service-b
  K8S_NS:   nt548-gr03

jobs:

  # ══════════════════════════════════════════
  # STAGE 1 — Checkout Code
  # ══════════════════════════════════════════
  stage1_checkout:
    name: "Stage 1 — Checkout Code"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Print Repo Structure
        run: |
          echo "Repo structure:"
          find ${{ env.WORK_DIR }} -type f | sort
          echo "Checkout done. Commit: ${{ github.sha }}"

  # ══════════════════════════════════════════
  # STAGE 2 — Build Docker Images
  # ══════════════════════════════════════════
  stage2_build:
    name: "Stage 2 — Build Docker Images"
    runs-on: ubuntu-latest
    needs: stage1_checkout

    outputs:
      image_tag: ${{ steps.tag.outputs.value }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Image Tag
        id: tag
        run: |
          TAG=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "value=${TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${TAG}"

      - name: Build Service A
        run: |
          docker build \
            -t ${{ env.IMAGE_A }}:${{ steps.tag.outputs.value }} \
            -t ${{ env.IMAGE_A }}:latest \
            ${{ env.WORK_DIR }}/service-a/
          echo "Service A built successfully"

      - name: Build Service B
        run: |
          docker build \
            -t ${{ env.IMAGE_B }}:${{ steps.tag.outputs.value }} \
            -t ${{ env.IMAGE_B }}:latest \
            ${{ env.WORK_DIR }}/service-b/
          echo "Service B built successfully"

  # ══════════════════════════════════════════
  # STAGE 3 — Unit Test
  # TODO: Tien
  # ══════════════════════════════════════════
  stage3_unit_test:
    name: "Stage 3 — Unit Test [TODO: Tien]"
    runs-on: ubuntu-latest
    needs: stage2_build

    outputs:
      image_tag: ${{ needs.stage2_build.outputs.image_tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unit Test Placeholder
        run: |
          echo "Placeholder. Tien will implement."
          echo "service-a: Jest (npm test)"
          echo "service-b: pytest test_app.py"

  # ══════════════════════════════════════════
  # STAGE 4 — SonarQube Analysis
  # TODO: Tien
  # ══════════════════════════════════════════
  stage4_sonarqube:
    name: "Stage 4 — SonarQube Analysis [TODO: Tien]"
    runs-on: ubuntu-latest
    needs: stage3_unit_test

    outputs:
      image_tag: ${{ needs.stage3_unit_test.outputs.image_tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SonarQube Analysis Placeholder
        run: |
          echo "Placeholder. Tien will implement."
          echo "Config: sonar/sonar-project.properties"
          echo "Requires: SONAR_TOKEN secret"

  # ══════════════════════════════════════════
  # STAGE 5 — Push Images to DockerHub
  # ══════════════════════════════════════════
  stage5_push:
    name: "Stage 5 — Push Images to DockerHub"
    runs-on: ubuntu-latest
    needs: stage4_sonarqube

    outputs:
      image_tag: ${{ needs.stage4_sonarqube.outputs.image_tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Rebuild Service A
        run: |
          docker build \
            -t ${{ env.IMAGE_A }}:${{ needs.stage4_sonarqube.outputs.image_tag }} \
            -t ${{ env.IMAGE_A }}:latest \
            ${{ env.WORK_DIR }}/service-a/

      - name: Rebuild Service B
        run: |
          docker build \
            -t ${{ env.IMAGE_B }}:${{ needs.stage4_sonarqube.outputs.image_tag }} \
            -t ${{ env.IMAGE_B }}:latest \
            ${{ env.WORK_DIR }}/service-b/

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Service A
        run: |
          docker push ${{ env.IMAGE_A }}:${{ needs.stage4_sonarqube.outputs.image_tag }}
          docker push ${{ env.IMAGE_A }}:latest
          echo "Service A pushed to DockerHub"

      - name: Push Service B
        run: |
          docker push ${{ env.IMAGE_B }}:${{ needs.stage4_sonarqube.outputs.image_tag }}
          docker push ${{ env.IMAGE_B }}:latest
          echo "Service B pushed to DockerHub"

  # ══════════════════════════════════════════
  # STAGE 6 — Quality Gate
  # TODO: Tien
  # ══════════════════════════════════════════
  stage6_quality_gate:
    name: "Stage 6 — Quality Gate [TODO: Tien]"
    runs-on: ubuntu-latest
    needs: stage5_push

    outputs:
      image_tag: ${{ needs.stage5_push.outputs.image_tag }}

    steps:
      - name: Quality Gate Placeholder
        run: |
          echo "Placeholder. Tien will implement."
          echo "Poll SonarCloud API for pass/fail result"

  # ══════════════════════════════════════════
  # STAGE 7 — Security Scan (Trivy)
  # TODO: Tien
  # ══════════════════════════════════════════
  stage7_trivy:
    name: "Stage 7 — Trivy Security Scan [TODO: Tien]"
    runs-on: ubuntu-latest
    needs: stage6_quality_gate

    outputs:
      image_tag: ${{ needs.stage6_quality_gate.outputs.image_tag }}

    steps:
      - name: Trivy Placeholder
        run: |
          echo "Placeholder. Tien will implement."
          echo "Scan target: ${{ env.IMAGE_A }}:${{ needs.stage6_quality_gate.outputs.image_tag }}"
          echo "Scan target: ${{ env.IMAGE_B }}:${{ needs.stage6_quality_gate.outputs.image_tag }}"

  # ══════════════════════════════════════════
  # STAGE 8 — Deploy to Kubernetes (Minikube)
  # Runs on self-hosted runner (has kubectl + minikube)
  # ══════════════════════════════════════════
  stage8_deploy:
    name: "Stage 8 — Deploy to Kubernetes"
    runs-on: [self-hosted, windows, minikube]
    needs: stage7_trivy

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Cluster
        shell: powershell
        run: |
          Write-Host "Minikube Status"
          minikube status
          Write-Host "Nodes"
          kubectl get nodes
          Write-Host "Context"
          kubectl config current-context

      - name: Apply Namespace
        shell: powershell
        run: |
          kubectl apply -f ${{ env.WORK_DIR }}/k8s/00-namespace.yaml
          Write-Host "Namespace ready: ${{ env.K8S_NS }}"

      - name: Patch Image Tags and Apply Deployments
        shell: powershell
        run: |
          $TAG  = "${{ needs.stage7_trivy.outputs.image_tag }}"
          $USER = "${{ secrets.DOCKERHUB_USERNAME }}"
          $DIR  = "${{ env.WORK_DIR }}/k8s"

          (Get-Content "$DIR/10-service-a.yaml") `
            -replace 'REGISTRY/nt548/service-a:TAG', "$USER/service-a:$TAG" |
            kubectl apply -n ${{ env.K8S_NS }} -f -

          (Get-Content "$DIR/20-service-b.yaml") `
            -replace 'REGISTRY/nt548/service-b:TAG', "$USER/service-b:$TAG" |
            kubectl apply -n ${{ env.K8S_NS }} -f -

          Write-Host "Deployments applied with tag: $TAG"

      - name: Apply Ingress
        shell: powershell
        run: |
          kubectl apply -f ${{ env.WORK_DIR }}/k8s/30-ingress.yaml `
            -n ${{ env.K8S_NS }}
          Write-Host "Ingress applied"

      - name: Wait for Rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/service-a `
            -n ${{ env.K8S_NS }} --timeout=120s
          kubectl rollout status deployment/service-b `
            -n ${{ env.K8S_NS }} --timeout=120s
          Write-Host "Both services rolled out successfully"

      - name: Verify Deployment
        shell: powershell
        run: |
          Write-Host "Pods"
          kubectl get pods -n ${{ env.K8S_NS }}
          Write-Host "Services"
          kubectl get svc -n ${{ env.K8S_NS }}
          Write-Host "Image deployed for service-a"
          kubectl get deployment service-a -n ${{ env.K8S_NS }} `
            -o jsonpath='{.spec.template.spec.containers[0].image}'
          Write-Host ""
          Write-Host "Image deployed for service-b"
          kubectl get deployment service-b -n ${{ env.K8S_NS }} `
            -o jsonpath='{.spec.template.spec.containers[0].image}'