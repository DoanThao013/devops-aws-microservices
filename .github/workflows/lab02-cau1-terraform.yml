name: Terraform CI/CD - Lab 02 Cau 1

on:
  push:
    branches: [main]
    paths:
      - 'lab02/cau1-terraform-github-actions/terraform/**'
  pull_request:
    branches: [main]
    paths:
      - 'lab02/cau1-terraform-github-actions/terraform/**'
  workflow_dispatch:

env:
  TF_VERSION: '1.7.5'
  WORKING_DIR: lab02/cau1-terraform-github-actions/terraform

jobs:
  # ─────────────────────────────────────────
  # Stage 1: Validate
  # ─────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  # ─────────────────────────────────────────
  # Stage 2: Security Scan (Checkov)
  # ─────────────────────────────────────────
  security-scan:
    name: Security Scan (Checkov)
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.WORKING_DIR }}
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true
          skip_check: >-
            CKV_AWS_88,
            CKV_AWS_8,
            CKV_AWS_135,
            CKV2_AWS_11,
            CKV2_AWS_41,
            CKV2_AWS_5

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif

  # ─────────────────────────────────────────
  # Stage 3: Plan (chỉ chạy khi PR hoặc bấm tay)
  # ─────────────────────────────────────────
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [validate, security-scan]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.CAU1_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CAU1_AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_my_ip: ${{ secrets.CAU1_MY_IP }}
          TF_VAR_key_name: ${{ secrets.CAU1_KEY_NAME }}
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt

      - name: Comment Plan on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' # Tránh lỗi API khi bấm tay
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync(
              `${{ env.WORKING_DIR }}/plan_output.txt`, 'utf8'
            ).slice(0, 60000);
            const body = `## 📋 Terraform Plan Result
            \`\`\`hcl
            ${planOutput}
            \`\`\`
            > **Triggered by**: @${{ github.actor }} | **Commit**: \`${{ github.sha }}\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # ─────────────────────────────────────────
  # Stage 4: Apply (chỉ chạy khi push main hoặc bấm tay)
  # ─────────────────────────────────────────
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [validate, security-scan]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    environment: production
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.CAU1_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CAU1_AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        env:
          TF_VAR_my_ip: ${{ secrets.CAU1_MY_IP }}
          TF_VAR_key_name: ${{ secrets.CAU1_KEY_NAME }}
        run: terraform apply -auto-approve

      - name: Show Outputs
        run: terraform output