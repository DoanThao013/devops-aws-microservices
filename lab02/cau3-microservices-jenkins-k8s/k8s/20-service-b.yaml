apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
  namespace: nt548-gr03
  labels: { app: service-b }
spec:
  replicas: 2
  selector:
    matchLabels: { app: service-b }
  template:
    metadata:
      labels: { app: service-b }
    spec:
      containers:
        - name: service-b
          image: REGISTRY/nt548/service-b:TAG
          ports: [{ containerPort: 5000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: service-b
  namespace: nt548-gr03
spec:
  type: ClusterIP
  selector: { app: service-b }
  ports:
    - port: 5000
      targetPort: 5000
