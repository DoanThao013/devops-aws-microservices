apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  namespace: nt548-gr03
  labels: { app: service-a }
spec:
  replicas: 2
  selector:
    matchLabels: { app: service-a }
  template:
    metadata:
      labels: { app: service-a }
    spec:
      containers:
        - name: service-a
          image: REGISTRY/nt548/service-a:TAG
          ports: [{ containerPort: 3000 }]
          env:
            - name: SERVICE_B_URL
              value: http://service-b:5000
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: service-a
  namespace: nt548-gr03
spec:
  type: NodePort
  selector: { app: service-a }
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
