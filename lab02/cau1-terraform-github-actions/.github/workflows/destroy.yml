name: Destroy Infrastructure (Cau 1)

on:
  workflow_dispatch: 

env:
  TF_VERSION: '1.7.5'
  WORKING_DIR: lab02/cau1-terraform-github-actions/terraform

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.CAU1_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CAU1_AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      - name: Terraform Destroy
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_my_ip: ${{ secrets.CAU1_MY_IP }}
          TF_VAR_key_name: ${{ secrets.CAU1_KEY_NAME }}
        run: terraform destroy -auto-approve