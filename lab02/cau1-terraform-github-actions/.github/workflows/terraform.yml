name: Terraform CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'lab02/cau1-terraform-github-actions/terraform/**'
  pull_request:
    branches: [main]
    paths:
      - 'lab02/cau1-terraform-github-actions/terraform/**'

env:
  TF_VERSION: '1.7.5'
  WORKING_DIR: lab02/cau1-terraform-github-actions/terraform

jobs:
  # ─────────────────────────────────────────
  # Stage 1: Validate
  # ─────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  # ─────────────────────────────────────────
  # Stage 2: Security Scan (Checkov)
  # ─────────────────────────────────────────
  security-scan:
    name: Security Scan (Checkov)
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.WORKING_DIR }}
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true
          # DANH SÁCH SKIP CÓ CHỌN LỌC (HỢP LÝ CHO MÔI TRƯỜNG LAB)
          skip_check: >-
            CKV_AWS_88,    # Bỏ qua: Đề bài yêu cầu tạo Public EC2
            CKV_AWS_130,   # Bỏ qua: Đề bài yêu cầu Public Subnet (có Auto-assign IP)
            CKV_AWS_382,   # Bỏ qua: Bài Lab cho phép Outbound 0.0.0.0/0 ra Internet
            CKV_AWS_126,   # Bỏ qua: Không bật Detailed Monitoring để tránh tốn tiền
            CKV2_AWS_11,   # Bỏ qua: Không bật VPC Flow Logs để tránh tốn tiền
            CKV2_AWS_5,    # Bỏ qua: Checkov thường bắt nhầm lỗi SG không được attach
            CKV2_AWS_41    # Bỏ qua: Bài Lab chưa yêu cầu dùng IAM Role cho EC2

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif

  # ─────────────────────────────────────────
  # Stage 3: Plan (chỉ chạy khi PR)
  # ─────────────────────────────────────────
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [validate, security-scan]
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.CAU1_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CAU1_AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_my_ip: ${{ secrets.CAU1_MY_IP }}
          TF_VAR_key_name: ${{ secrets.CAU1_KEY_NAME }}
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt

      - name: Comment Plan on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync(
              `${{ env.WORKING_DIR }}/plan_output.txt`, 'utf8'
            ).slice(0, 60000);
            const body = `## 📋 Terraform Plan Result
            \`\`\`hcl
            ${planOutput}
            \`\`\`
            > **Triggered by**: @${{ github.actor }} | **Commit**: \`${{ github.sha }}\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # ─────────────────────────────────────────
  # Stage 4: Apply (chỉ chạy khi merge vào main)
  # ─────────────────────────────────────────
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [validate, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.CAU1_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CAU1_AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        env:
          TF_VAR_my_ip: ${{ secrets.CAU1_MY_IP }}
          TF_VAR_key_name: ${{ secrets.CAU1_KEY_NAME }}
        run: terraform apply -auto-approve

      - name: Show Outputs
        run: terraform output