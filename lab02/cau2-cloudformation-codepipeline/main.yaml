AWSTemplateFormatVersion: '2010-09-09'
Description: 'NT548 Lab 01 - Parent stack: VPC, Subnets, IGW, NAT, RT, SG, EC2 (nested stacks)'

Parameters:
  NamePrefix:
    Type: String
    Default: nt548
  TemplateBucket:
    Type: String
    Description: S3 bucket containing nested templates (must upload templates/ to this bucket first)
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  PublicSubnetCidr:
    Type: String
    Default: 10.0.1.0/24
  PrivateSubnetCidr:
    Type: String
    Default: 10.0.2.0/24
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
  MyIp:
    Type: String
    Description: Your public IP in CIDR (e.g. 1.2.3.4/32)
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
  InstanceType:
    Type: String
    Default: t2.micro
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2

Resources:
  VpcStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucket}.s3.amazonaws.com/templates/vpc.yaml'
      Parameters:
        NamePrefix: !Ref NamePrefix
        VpcCidr: !Ref VpcCidr

  SubnetsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucket}.s3.amazonaws.com/templates/subnets.yaml'
      Parameters:
        NamePrefix: !Ref NamePrefix
        VpcId: !GetAtt VpcStack.Outputs.VpcId
        PublicSubnetCidr: !Ref PublicSubnetCidr
        PrivateSubnetCidr: !Ref PrivateSubnetCidr
        AvailabilityZone: !Ref AvailabilityZone

  NatStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucket}.s3.amazonaws.com/templates/nat.yaml'
      Parameters:
        NamePrefix: !Ref NamePrefix
        PublicSubnetId: !GetAtt SubnetsStack.Outputs.PublicSubnetId

  RouteTablesStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucket}.s3.amazonaws.com/templates/route-tables.yaml'
      Parameters:
        NamePrefix: !Ref NamePrefix
        VpcId: !GetAtt VpcStack.Outputs.VpcId
        InternetGatewayId: !GetAtt VpcStack.Outputs.InternetGatewayId
        NatGatewayId: !GetAtt NatStack.Outputs.NatGatewayId
        PublicSubnetId: !GetAtt SubnetsStack.Outputs.PublicSubnetId
        PrivateSubnetId: !GetAtt SubnetsStack.Outputs.PrivateSubnetId

  SecurityGroupsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucket}.s3.amazonaws.com/templates/security-groups.yaml'
      Parameters:
        NamePrefix: !Ref NamePrefix
        VpcId: !GetAtt VpcStack.Outputs.VpcId
        MyIp: !Ref MyIp

  Ec2Stack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucket}.s3.amazonaws.com/templates/ec2.yaml'
      Parameters:
        NamePrefix: !Ref NamePrefix
        AmiId: !Ref AmiId
        InstanceType: !Ref InstanceType
        KeyName: !Ref KeyName
        PublicSubnetId: !GetAtt SubnetsStack.Outputs.PublicSubnetId
        PrivateSubnetId: !GetAtt SubnetsStack.Outputs.PrivateSubnetId
        PublicSgId: !GetAtt SecurityGroupsStack.Outputs.PublicSgId
        PrivateSgId: !GetAtt SecurityGroupsStack.Outputs.PrivateSgId

Outputs:
  VpcId:
    Value: !GetAtt VpcStack.Outputs.VpcId
  PublicEc2PublicIp:
    Value: !GetAtt Ec2Stack.Outputs.PublicEc2PublicIp
  PrivateEc2PrivateIp:
    Value: !GetAtt Ec2Stack.Outputs.PrivateEc2PrivateIp
