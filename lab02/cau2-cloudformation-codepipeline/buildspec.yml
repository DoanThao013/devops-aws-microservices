version: 0.2
# CodeBuild buildspec - Lint + Validate + Taskcat for CloudFormation templates

env:
  variables:
    TEMPLATE_DIR: lab01/cloudformation
    AWS_DEFAULT_REGION: ap-southeast-1

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "[install] Installing cfn-lint and taskcat"
      - pip install --upgrade pip
      - pip install cfn-lint taskcat
      - cfn-lint --version
      - taskcat --version

  pre_build:
    commands:
      - echo "[pre_build] Validating CloudFormation templates"
      - cd $TEMPLATE_DIR
      - aws cloudformation validate-template --template-body file://main.yaml
      - for tpl in templates/*.yaml; do
          echo "Validating $tpl";
          aws cloudformation validate-template --template-body file://$tpl;
        done

  build:
    commands:
      - echo "[build] Linting with cfn-lint"
      - cfn-lint main.yaml templates/*.yaml
      - echo "[build] Running Taskcat tests"
      - taskcat test run -t lab01-test || true

  post_build:
    commands:
      - echo "[post_build] Lint + Taskcat finished"
      - ls -la taskcat_outputs/ || true

artifacts:
  files:
    - lab01/cloudformation/main.yaml
    - lab01/cloudformation/templates/**/*
    - lab01/cloudformation/parameters.json
  discard-paths: no

reports:
  cfn-lint-report:
    files:
      - cfn-lint-report.xml
    file-format: JUNITXML
